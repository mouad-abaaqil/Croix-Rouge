services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY in .env}
      APP_HTTPS: ${APP_HTTPS:-0}
      DATABASE_PATH: /app/instance/redcollect.sqlite3
      ROUTING_URL: http://routing:5000
      ROUTE_SOLVER_SECONDS: ${ROUTE_SOLVER_SECONDS:-1}
      SMTP_SERVER: ${SMTP_SERVER:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SENDER_EMAIL: ${SENDER_EMAIL:-}
      GEOCODER_URL: ${GEOCODER_URL:-https://nominatim.openstreetmap.org/search}
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "1", "--timeout", "30", "webapp:app"]
    volumes:
      - redcollect-data:/app/instance
    ports:
      - "127.0.0.1:${APP_PORT:-5000}:8000"
    depends_on:
      routing:
        condition: service_started

  routing:
    image: ghcr.io/project-osrm/osrm-backend:latest
    restart: unless-stopped
    command: ["osrm-routed", "--algorithm", "mld", "/data/nord-pas-de-calais-latest.osrm"]
    volumes:
      - ./routing-data:/data:ro
    ports:
      - "127.0.0.1:5001:5000"

volumes:
  redcollect-data:
